<!DOCTYPE html>
<html>
  <head>
    <title>ChatBot</title>
    <script src="script.ts"></script>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function ChatInput({chatMessages,setChatMessages}){
        const[inputText,setInputText]=React.useState('');
        function saveInputText(event){
            setInputText(event.target.value)
        }

        function sendMessage(){
            const newChatMessages=[
                    ...chatMessages,{
                        message:inputText,
                        sender:'User',
                        id: crypto.randomUUID()
                   }
            ]

            setChatMessages(newChatMessages);

            const response = Chatbot.getResponse(inputText);
            setChatMessages([
                ...newChatMessages,{
                    message:response,
                    sender:'Chatbot',
                    id: crypto.randomUUID()
                   }
            ]);
            setInputText('');
        }

        return(
            <>
                <input placeholder="Send a message to ChatBot" size="30" onChange={saveInputText} value={inputText}/>
                <button onClick={sendMessage}>Send</button>
            </>
        );
      }

      function ChatMsg(props){
        // const message = props.message; // instead of this use
        // const sender=props.sender;
        const {message,sender} = props; // instead of this also there is a better way
        // if(sender === 'Chatbot'){
        //     return(
        //         <div>
        //             <img src="chatbot.jpg" width="40"/>
        //             {message}
        //         </div>  
        //     );
        // }
            return(
                <div>
                    {sender ==='Chatbot' && <img src="chatbot.jpg" width="40"/>}
                    {message}
                    {sender === 'User' && <img src="user.jpg" width="40" />}
                </div>
            );
        }


        function ChatMessages({chatMessages}){
            // const array = React.useState(
            //     [{
            //     message:'hello chatbot',sender:'User',id:'1'
            //     },{
            //     message:"Hello! How can i help you today?" ,sender:"Chatbot",id:'2'
            //     },{
            //     message:"can you flip a coin", sender:"User",id:'3'
            //     },{
            //     message:"Sure! It flipped to Heads.", sender:"Chatbot",id:'4'
            // }]);

            


            return(
                <>
                    {chatMessages.map((chatMessage)=>{
                        return(<ChatMsg message={chatMessage.message} sender={chatMessage.sender} key={chatMessage.id}/>)
                    })}
                </>
            );
        }



        function App(){

            const [chatMessages,setChatMessages]=React.useState([

                {
                    message: 'hello chatbot',
                    sender: 'User',
                    id: '1'
                },
                {
                    message: 'Hello! How can I help you today?',
                    sender: 'Chatbot',
                    id: '2'
                },
                {
                    message: 'can you flip a coin',
                    sender: 'User',
                    id: '3'
                },
                {
                    message: 'Sure! It flipped to Heads.',
                    sender: 'Chatbot',
                    id: '4'
                }
            ]);
            
            // const chatMessages = array[0];
            // const setChatMessages = array[1];

            return(
                <>
                    <ChatInput chatMessages={chatMessages} setChatMessages={setChatMessages}/>
                    <ChatMessages chatMessages={chatMessages}/>
                </>        
            );
        }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
