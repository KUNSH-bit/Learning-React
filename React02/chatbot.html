<!DOCTYPE html>
<html>
  <head>
    <title>ChatBot</title>
    <style>
        body{
            font-family: Arial;
        }
        .Send-Button{
            background-color: rgb(25,135,84);
            color : white;
            padding: 12px 20px;
            margin-left: 10px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
        }

        .Input{
            padding: 12px 15px;
            border-radius: 10px;
            border-width: 1px;
            font-size: 15px;

            flex-grow: 1;
        }

        .flex-box{
            display: flex;
            margin-bottom: 60px;
        }

        .to-mid{
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;

            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .chat-msg-user{
            display: flex;
            justify-content: end;
            align-items: start;
        }
        .chat-msg-chatbot{
            display: flex;
            align-items: start;            
        }
        .chat-msg-text{
            background-color: rgb(238,238,238);
            border-radius: 10px;
            padding: 15px 20px;
            margin-right: 10px;
            margin-left: 10px;
            margin-bottom: 20px;
            max-width: 300px;
        }
        .chat-msg-profile{
            width: 45px;
            border-radius: 360px;
        }
        .chat-msg-bottom{
            flex-grow: 1;
            margin-top: 20px;
            overflow: scroll;
            scrollbar-width: none;
        }

    </style>
    <script src="script.ts"></script>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function ChatInput({chatMessages,setChatMessages}){
        const[inputText,setInputText]=React.useState('');
        function saveInputText(event){
            setInputText(event.target.value)
        }

        function sendMessage(){
            const newChatMessages=[
                    ...chatMessages,{
                        message:inputText,
                        sender:'User',
                        id: crypto.randomUUID()
                   }
            ]

            setChatMessages(newChatMessages);

            const response = Chatbot.getResponse(inputText);
            setChatMessages([
                ...newChatMessages,{
                    message:response,
                    sender:'Chatbot',
                    id: crypto.randomUUID()
                   }
            ]);
            setInputText('');
        }

        return(
            <div className="flex-box">
                <input placeholder="Send a message to ChatBot" size="30" onChange={saveInputText} value={inputText} className="Input"/>
                <button onClick={sendMessage} className="Send-Button">Send</button>
            </div>
        );
      }

      function ChatMsg(props){
        // const message = props.message; // instead of this use
        // const sender=props.sender;
        const {message,sender} = props; // instead of this also there is a better way
        // if(sender === 'Chatbot'){
        //     return(
        //         <div>
        //             <img src="chatbot.jpg" width="40"/>
        //             {message}
        //         </div>  
        //     );
        // }
            return(
                <div className={sender==='User'?'chat-msg-user':'chat-msg-chatbot'}>
                    {sender ==='Chatbot' && <img src="chatbot.jpg" className='chat-msg-profile'/>}
                    <div className="chat-msg-text">
                        {message}
                    </div>
                    {sender === 'User' && <img src="user.jpg" className='chat-msg-profile' />}
                </div>
            );
        }


        function ChatMessages({chatMessages}){
            const chatMsgRef=React.useRef(null);
            React.useEffect(()=>{
                const containerElem=chatMsgRef.current;
                if (containerElem){
                    containerElem.scrollTop=containerElem.scrollHeight;
                }
            },[chatMessages]);
            // const array = React.useState(
            //     [{
            //     message:'hello chatbot',sender:'User',id:'1'
            //     },{
            //     message:"Hello! How can i help you today?" ,sender:"Chatbot",id:'2'
            //     },{
            //     message:"can you flip a coin", sender:"User",id:'3'
            //     },{
            //     message:"Sure! It flipped to Heads.", sender:"Chatbot",id:'4'
            // }]);
            return(
                <div className="chat-msg-bottom" ref={chatMsgRef}>
                    {chatMessages.map((chatMessage)=>{
                        return(<ChatMsg message={chatMessage.message} sender={chatMessage.sender} key={chatMessage.id}/>)
                    })}
                </div>
            );
        }



        function App(){

            const [chatMessages,setChatMessages]=React.useState([

                {
                    message: 'hello chatbot',
                    sender: 'User',
                    id: '1'
                },
                {
                    message: 'Hello! How can I help you today?',
                    sender: 'Chatbot',
                    id: '2'
                },
                {
                    message: 'can you flip a coin',
                    sender: 'User',
                    id: '3'
                },
                {
                    message: 'Sure! It flipped to Heads.',
                    sender: 'Chatbot',
                    id: '4'
                }
            ]);
            
            // const chatMessages = array[0];
            // const setChatMessages = array[1];

            return(
                <div className="to-mid">
                    <ChatMessages chatMessages={chatMessages}/>
                    <ChatInput chatMessages={chatMessages} setChatMessages={setChatMessages}/>
                </div>        
            );
        }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
